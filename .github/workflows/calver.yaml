name: CalVer Tagging
on:
  workflow_dispatch:
    inputs:
      variant:
        required: true
        description: Variant tag to pass to CalVer
        type: string
  push:
    branches:
      - "**"
    tags:
      - "!**"
concurrency: tag-scripts
jobs:
  apply:
    runs-on: ubuntu-latest
    name: Tag revision
    steps:
      - name: Version
        uses: acrois/calver@trunk

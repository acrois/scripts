name: Shellcheck
on:
  workflow_dispatch:
  push:
    paths:
      - "shell/*.sh"
      - "test/*"
env:
  SHELLCHECK_OPTS: -e SC1071 -e SC2148
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: "recursive"
    - name: Check Tests
      uses: ludeeus/action-shellcheck@2.0.0
      with:
        scandir: './tests'
        ignore_paths: >-
          output
          requirements.txt
    - name: Check Scripts
      uses: ludeeus/action-shellcheck@2.0.0
      with:
        scandir: './scripts'
        ignore_paths: >-
          __pycache__
          requirements.txt
